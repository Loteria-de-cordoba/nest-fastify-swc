services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_SSL: "false"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Run npm run setup to create docker/.env}
      POSTGRES_USER: ${DB_USER:?Run npm run setup to create docker/.env}
      POSTGRES_PASSWORD: ${DB_PASS:?Run npm run setup to create docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
